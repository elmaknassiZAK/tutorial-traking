<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cours · Frontend Mastery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github-dark.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="lesson-nav">
    <a class="btn btn--ghost" href="index.html">← Dashboard</a>
    <span>
      <a class="btn btn--ghost" id="prevBtn" hidden>← 9bel</a>
      <a class="btn btn--ghost" id="nextBtn" hidden>Mn be3d →</a>
    </span>
  </nav>

  <main>
    <article class="lesson" id="lesson">
      <p class="lesson-error">Kayt7mel...</p>
    </article>
  </main>

  <footer class="footer" style="justify-content:center">
    <span id="actions"></span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
  <script src="data.js"></script>
  <script>
    // ---------- Page dyal cours : kat9ra lessons/<id>.md w katrendrih ----------
    const STORAGE_KEY = "fm-status";
    const params = new URLSearchParams(location.search);
    const id = params.get("id");

    const days = window.COURSE.weeks.flatMap((w) => w.days);
    const withLesson = days.filter((d) => d.lesson);
    const index = withLesson.findIndex((d) => d.id === id);
    const day = withLesson[index];
    const box = document.getElementById("lesson");

    function loadOverrides() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
    }
    function saveOverrides(o) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(o)); } catch {}
    }

    function renderActions() {
      const o = loadOverrides();
      const done = (o[day.id] || day.status) === "done";
      const actions = document.getElementById("actions");
      actions.innerHTML = done
        ? `<span class="badge badge--done">${day.id} sali ✓</span>`
        : `<button class="btn" id="doneBtn">✓ Salit ${day.id}</button>`;
      const btn = document.getElementById("doneBtn");
      if (btn) btn.addEventListener("click", () => {
        o[day.id] = "done";
        saveOverrides(o);
        renderActions();
      });
    }

    function setNav(btnId, target) {
      const btn = document.getElementById(btnId);
      if (!target) return;
      btn.href = `lesson.html?id=${target.id}`;
      btn.title = target.title;
      btn.hidden = false;
    }

    async function load() {
      if (!day) {
        box.innerHTML = `<p class="lesson-error">Had l cours mazal ma kaynch. Rja3 l dashboard.</p>`;
        return;
      }
      document.title = `${day.id} · ${day.title}`;
      setNav("prevBtn", withLesson[index - 1]);
      setNav("nextBtn", withLesson[index + 1]);

      try {
        const res = await fetch(`lessons/${day.id}.md`);
        if (!res.ok) throw new Error(res.status);
        const md = await res.text();
        if (window.marked) {
          box.innerHTML = marked.parse(md);
          if (window.hljs) box.querySelectorAll("pre code").forEach((el) => hljs.highlightElement(el));
          box.querySelectorAll('a[href^="http"]').forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });
        } else {
          box.innerHTML = "";
          const pre = document.createElement("pre");
          pre.textContent = md;
          box.appendChild(pre);
        }
        renderActions();
      } catch (e) {
        box.innerHTML = `<p class="lesson-error">Ma9dertch n7mel l cours (${e.message}). Ila kenti 7aleh men fichier, khdem b Live Server.</p>`;
      }
    }

    load();
  </script>
</body>
</html>
